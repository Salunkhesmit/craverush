<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | CraveRush</title>

    <script>
        (function() {
            if (localStorage.getItem('creamySwirlsTheme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">CraveRush</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="desserts.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="find-us.html">Find Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <a href="products.html" class="text-dark"><i class="bi bi-search fs-5"></i></a>
                    <div class="dropdown">
                        <a href="javascript:void(0)" class="text-dark d-flex align-items-center"
                        id="accountIcon" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person fs-5"></i>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" id="accountMenu" aria-labelledby="accountIcon"></ul>
                    </div>
                    <a href="cart.html" class="text-dark position-relative">
                        <i class="bi bi-bag fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-4">
        <div class="container">
            <a href="javascript:history.back()" class="text-decoration-none text-muted mb-3 d-inline-block"><i class="bi bi-arrow-left me-1"></i> Back</a>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb" id="breadcrumb-container">
                    <!-- Dynamic Breadcrumb -->
                </ol>
            </nav>
        </div>
    </section>

    <!-- Product Details -->
    <section class="pb-5">
        <div class="container">
            <div class="row g-5 align-items-center" id="product-detail-container">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Related Products -->
    <section class="pb-5 mb-5">
        <div class="container">
            <h2 class="section-title mb-4">Related Products</h2>
            <div class="row g-4" id="related-products">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="products.js"></script>
    <script src="auth.js"></script>
    <script src="cart.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id')) || 1;
            renderProductDetails(productId);
        });
    </script>
</body>
</html>
