<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | CraveRush</title>
    <script>
        (function() {
            if (localStorage.getItem('creamySwirlsTheme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">CraveRush</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="desserts.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="find-us.html">Find Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <a href="products.html" class="text-dark"><i class="bi bi-search fs-5"></i></a>
                    <div class="dropdown">
                        <a href="javascript:void(0)" class="text-dark" id="accountIcon" data-bs-toggle="dropdown">
                            <i class="bi bi-person fs-5"></i>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" id="accountMenu"></ul>
                    </div>
                    <a href="cart.html" class="text-dark position-relative">
                        <i class="bi bi-bag fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <section class="account-section">
        <div class="container" style="max-width: 820px;">
            <a href="index.html" class="text-decoration-none text-muted mb-3 d-inline-block">
                <i class="bi bi-arrow-left me-1"></i> Back
            </a>
            <h1 class="display-5 fw-bold mb-4">My Account</h1>

            <div class="account-tabs" id="accountTabs">
                <button class="account-tab active" data-panel="profile">Profile</button>
                <button class="account-tab" data-panel="settings">Settings</button>
            </div>

            <!-- PROFILE -->
            <div class="account-panel active" id="panel-profile">
                <div class="account-card">
                    <h4><i class="bi bi-person-circle me-2"></i>My Profile</h4>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Name</label>
                            <input type="text" class="form-control" id="profile-name">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Email</label>
                            <input type="email" class="form-control" id="profile-email" disabled>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Contact Number</label>
                            <input type="tel" class="form-control" id="profile-phone">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">City</label>
                            <input type="text" class="form-control" id="profile-city">
                        </div>
                    </div>
                    <button class="btn btn-custom mt-3" onclick="saveProfile()">Save Changes</button>
                </div>
            </div>

            <!-- SETTINGS -->
            <div class="account-panel" id="panel-settings">
                <div class="account-card">
                    <h4><i class="bi bi-palette me-2"></i>Appearance</h4>
                    <div class="dark-toggle">
                        <span class="fw-semibold">Dark Mode</span>
                        <label class="switch">
                            <input type="checkbox" id="dark-toggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="account-card">
                    <h4><i class="bi bi-key me-2"></i>Change Password</h4>
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-semibold">Current Password</label>
                            <input type="password" class="form-control" id="cur-pass">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">New Password</label>
                            <input type="password" class="form-control" id="new-pass">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Confirm New Password</label>
                            <input type="password" class="form-control" id="new-pass-confirm">
                        </div>
                    </div>
                    <button class="btn btn-custom mt-3" onclick="changePassword()">Change Password</button>
                    <p class="text-muted small mt-2 mb-0">Frontend demo only — not real authentication.</p>
                </div>

                <div class="account-card">
                    <h4><i class="bi bi-box-arrow-right me-2"></i>Sign Out</h4>
                    <button class="btn btn-outline-custom" onclick="logoutUser(event)">Logout</button>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!isLoggedIn()) { window.location.href = 'login.html'; return; }

            const user = getCurrentUser() || {};
            document.getElementById('profile-name').value  = user.name  || '';
            document.getElementById('profile-email').value = user.email || '';
            document.getElementById('profile-phone').value = user.phone || '';
            document.getElementById('profile-city').value = user.city || '';

            document.querySelectorAll('.account-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.account-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.account-panel').forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
                });
            });

            const darkToggle = document.getElementById('dark-toggle');
            darkToggle.checked = isDarkMode();
            darkToggle.addEventListener('change', () => toggleDarkMode());
        });

        function saveProfile() {
            const name  = document.getElementById('profile-name').value.trim();
            const phone = document.getElementById('profile-phone').value.trim();
            const city  = document.getElementById('profile-city').value.trim();
            if (!name) { alert('Name cannot be empty'); return; }
            updateProfile({ name, phone, city });
            initAccountMenu();
            alert('Profile updated.');
        }

        function changePassword() {
            const cur  = document.getElementById('cur-pass').value;
            const nw   = document.getElementById('new-pass').value;
            const conf = document.getElementById('new-pass-confirm').value;

            if (!cur || !nw || !conf) { alert('Please fill in all fields.'); return; }
            if (cur !== getStoredPassword()) { alert('Current password is incorrect.'); return; }
            if (nw.length < 4) { alert('New password must be at least 4 characters.'); return; }
            if (nw !== conf) { alert('New passwords do not match.'); return; }

            setStoredPassword(nw);
            document.getElementById('cur-pass').value = '';
            document.getElementById('new-pass').value = '';
            document.getElementById('new-pass-confirm').value = '';
            alert('Password changed successfully.');
        }
    </script>
</body>
</html>
